# Render Blueprint: one web service (Docker) plus a managed PostgreSQL database.
# In Render: New > Blueprint, pick this repository, and Render creates both.
services:
  - type: web
    name: projectscore
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: projectscore-db
          property: connectionString
      # First administrator, created on first start if no users exist. Render asks for these values.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ORG
        value: ProjectScore

databases:
  - name: projectscore-db
    plan: basic-256mb
    databaseName: projectscore
